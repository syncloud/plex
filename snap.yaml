apps:
  server:
    user: plex
    command: bin/service.plex.sh start
    daemon: simple
    start-timeout: 600s
    plugs:
    - network
    - network-bind
    restart-condition: always
    restart-delay: 10s
    before: [nginx]

  nginx:
    user: plex
    command: bin/service.nginx.sh
    daemon: simple
    plugs:
    - network
    - network-bind
    restart-condition: always
    restart-delay: 10s
    start-timeout: 600s

  storage-change:
    command: bin/cli storage-change

  access-change:
    command: bin/cli access-change

  backup-pre-stop:
    command: bin/cli backup-pre-stop

  restore-pre-start:
    command: bin/cli restore-pre-start

  restore-post-start:
    command: bin/cli restore-post-start

confinement: strict
description: Plex
grade: stable
name: plex
summary: Plex Media Server
